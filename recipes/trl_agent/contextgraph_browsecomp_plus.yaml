actor_rollout_ref:
  rollout:
    prompt_length: 1024
    response_length: 8192
    plugin:
      workflow: search_graph
      max_turn: 24
      turn_max_new_tokens: 1024
      max_session: 3
      session_timeout: 3600
      enable_summary: false
      branch_len: 2048
      final_answer_reserve: 512
      final_answer_safety_margin: 64
      max_traj: 4
      must_finish: true
      must_search: true
      must_branch: true
      structured_graph_controller: true
      controller_owned_tool_formatting: true
      controller_action_policy: structural
      graph_controller_temperature: 0.0
      graph_controller_top_p: 1.0
      initial_consolidation_turn: 1
      consolidation_interval: 2
      graph_controller_min_completion_tokens: 256
      graph_rpo_credit_backend: old_policy_counterfactual_qa
      graph_rpo_scope_process_reward: false
      graph_rpo_delta_max: 0.25
      graph_rpo_counterfactual_samples: 1
      graph_rpo_counterfactual_max_new_tokens: 256
      graph_rpo_counterfactual_temperature: 0.0
      graph_rpo_counterfactual_top_p: 1.0
      graph_rpo_operation_costs:
        merge: 0.0
        prune: 0.0
        add_edge: 0.0
        select: 0.0
      process_reward:
        - graphrpo
algorithm:
  adv_estimator: graphrpo
  graphrpo_alpha: 1.0
  graphrpo_beta: 1.0
  graphrpo_epsilon: 1.0e-6
  graphrpo_require_binary_reward: true
